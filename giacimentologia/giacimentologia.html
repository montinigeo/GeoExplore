<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classificazione dei Giacimenti Minerari</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090e;--panel:#0d0f16;--border:#1e2130;--border2:#2a2e42;
  --text:#e0e3f0;--muted:#8a8fa8;--dim:#444860;
  --mag:#f0a030;--mag2:#f0c060;
  --hyd:#00b8e0;--hyd2:#60d8f8;
  --sed:#40b870;--sed2:#80e0a0;
  --met:#c060f0;--met2:#e090ff;
  --sup:#e05050;--sup2:#f09090;
  --mono:'Space Mono',monospace;--sans:'Crimson Pro',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:.5rem 1.2rem;display:flex;align-items:center;gap:1.2rem;flex-shrink:0}
header h1{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mag)}
header p{font-family:var(--sans);font-size:.8rem;color:var(--muted);font-style:italic}
.filters{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.fb{border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.55rem;letter-spacing:.06em;padding:.2rem .5rem;border-radius:3px;cursor:pointer;transition:all .15s}
.fb:hover,.fb.on{border-color:var(--mag);color:var(--mag)}
.fb[data-f="hyd"].on{border-color:var(--hyd);color:var(--hyd)}
.fb[data-f="sed"].on{border-color:var(--sed);color:var(--sed)}
.fb[data-f="met"].on{border-color:var(--met);color:var(--met)}
.fb[data-f="sup"].on{border-color:var(--sup);color:var(--sup)}
.main-wrap{display:flex;flex:1;overflow:hidden}
.sb{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:.6rem .7rem;border-bottom:1px solid var(--border)}
.sb-top .sl{font-family:var(--mono);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:.3rem}
.metal-btns{display:flex;flex-wrap:wrap;gap:.2rem}
.mb{border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:var(--mono);font-size:.52rem;padding:.15rem .35rem;border-radius:2px;cursor:pointer;transition:all .12s}
.mb:hover,.mb.on{background:rgba(240,160,48,.12);border-color:var(--mag);color:var(--mag)}
.info-panel{flex:1;overflow-y:auto;padding:.7rem}
.info-panel .sl{font-family:var(--mono);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:.4rem}
.info-box{font-size:.75rem;color:var(--muted);line-height:1.65}
.info-box b{color:var(--text);font-family:var(--mono);font-size:.65rem}
.info-box .tag{display:inline-block;padding:.1rem .35rem;border-radius:2px;font-family:var(--mono);font-size:.5rem;letter-spacing:.06em;margin:.1rem .1rem .1rem 0}
.tag.mag{background:rgba(240,160,48,.15);color:var(--mag)}
.tag.hyd{background:rgba(0,184,224,.15);color:var(--hyd)}
.tag.sed{background:rgba(64,184,112,.15);color:var(--sed)}
.tag.met{background:rgba(192,96,240,.15);color:var(--met)}
.tag.sup{background:rgba(224,80,80,.15);color:var(--sup)}
.info-box .row{display:flex;gap:.3rem;margin:.25rem 0}
.info-box .lbl{color:var(--dim);font-family:var(--mono);font-size:.55rem;width:70px;flex-shrink:0}
.info-box .val{color:var(--muted);flex:1}
.info-box .esempi{margin-top:.5rem;padding:.4rem .5rem;background:rgba(240,160,48,.05);border-left:2px solid var(--mag);border-radius:0 3px 3px 0;font-size:.72rem}
.canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.legend{position:absolute;bottom:.6rem;left:.6rem;display:flex;flex-direction:column;gap:.2rem}
.leg-item{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.52rem;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:50%}
.tooltip{position:absolute;background:var(--panel);border:1px solid var(--border2);border-radius:4px;padding:.4rem .6rem;font-family:var(--mono);font-size:.58rem;color:var(--text);pointer-events:none;display:none;white-space:nowrap;z-index:10}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Classificazione Giacimenti Minerari</h1>
    <p>Seleziona un nodo per dettagli · Filtra per tipo o metallo</p>
  </div>
  <div class="filters">
    <button class="fb on" data-f="mag">⬤ Magmatici</button>
    <button class="fb on" data-f="hyd">⬤ Idrotermali</button>
    <button class="fb on" data-f="sed">⬤ Sedimentari</button>
    <button class="fb on" data-f="met">⬤ Metamorfici</button>
    <button class="fb on" data-f="sup">⬤ Supergene</button>
  </div>
</header>
<div class="main-wrap">
  <div class="sb">
    <div class="sb-top">
      <div class="sl">Filtra per metallo</div>
      <div class="metal-btns" id="metalBtns"></div>
    </div>
    <div class="info-panel">
      <div class="sl">Informazioni giacimento</div>
      <div class="info-box" id="infoBox">
        <span style="color:var(--dim);font-style:italic">Seleziona un nodo nel diagramma per vedere i dettagli del tipo di giacimento.</span>
      </div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--mag)"></div>Magmatico</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--hyd)"></div>Idrotermale</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--sed)"></div>Sedimentario</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--met)"></div>Metamorfico</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--sup)"></div>Supergene/Weathering</div>
    </div>
    <div class="tooltip" id="tip"></div>
  </div>
</div>

  {id:'lat_ni', t:'sup', n:'Laterite nichelifera', sub:'Weathering di ultrabasiti',
   metalli:['Ni','Co'], tenore:'1–2.5% Ni; 0.05–0.15% Co',dim:'10–500 Mt',
   amb:'Profili lateritici su peridotiti in clima tropicale',
   geodin:'Piattaforme tropicali su terreni ultramafici',
   min:'Goethite (zona ossidica), garnierite, smectite Ni (zona saprolite)',
   esempi:'Nuova Caledonia (~30 Ma), Filippine (Quaternario), Cerro Matoso (Colombia), ultramafiti calabre (Italia, Quaternario)',
   expl:'Perforazioni RC a poca profondità, campionamento sistematico profilo',
   x:.55, y:.55},
  {id:'sup_cu', t:'sup', n:'Arricchimento supergene Cu', sub:'Ridistribuzione Cu in zona vadosa',
   metalli:['Cu'], tenore:'0.5–2% Cu (zona supergene)',dim:'100–5000 Mt',
   amb:'Zona di ossidazione + cementation zone sopra porphyry primario',
   geodin:'Arco magmatico (stesso del porphyry)',
   min:'Calcosina (Cu₂S), covellina; zona ossidica: malachite, azzurrite, crisocolla',
   esempi:'Chuquicamata e Radomiro Tomic (Cile), Morenci (USA), Río Tinto (gossan)',
   expl:'Campionamento gossan, trincee, perforazioni RC shallow',
   x:.55, y:.70},
  {id:'bauxite_sup', t:'sup', n:'Bauxite (deposito residuale)', sub:'Lateritizzazione tropicale — Evans: deposito residuale/supergene',
   metalli:['Al'], tenore:'40–60% Al₂O₃',dim:'Grandi depositi piatti',
   amb:'Superfici planare su rocce alluminosilicatiche',
   geodin:'Piattaforma cratonico intertropicale',
   min:'Gibbsite, boehmite, diasporo, goethite, ematite',
   esempi:'Guinea (Sangarédi), Weipa (Australia), Paragominas (Brasile)',
   expl:'Rilevamento da satellite, perforazioni superficiali, campionamento',
   x:.55, y:.85},
];

// ─── METALLI UNICI ────────────────────────────────────────────────
const allMetals=[...new Set(DEPOSITS.flatMap(d=>d.metalli))].sort();
const metalBtns=document.getElementById('metalBtns');
allMetals.forEach(m=>{
  const b=document.createElement('button');
  b.className='mb'; b.textContent=m; b.dataset.m=m;
  b.addEventListener('click',()=>{
    b.classList.toggle('on');
    draw();
  });
  metalBtns.appendChild(b);
});

// ─── FILTRI TIPO ──────────────────────────────────────────────────
const activeTypes=new Set(['mag','hyd','sed','met','sup']);
document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click',()=>{
    const f=b.dataset.f;
    if(activeTypes.has(f)){activeTypes.delete(f);b.classList.remove('on');}
    else{activeTypes.add(f);b.classList.add('on');}
    draw();
  });
});

// ─── CANVAS ───────────────────────────────────────────────────────
const C=document.getElementById('c');
const ctx=C.getContext('2d');
let W,H,sel=null;

function resize(){
  const r=C.getBoundingClientRect();
  W=C.width=Math.round(r.width);
  H=C.height=Math.round(r.height);
  draw();
}
window.addEventListener('resize',resize);

function getActiveMetals(){
  return [...document.querySelectorAll('.mb.on')].map(b=>b.dataset.m);
}

function isVisible(d){
  if(!activeTypes.has(d.t)) return false;
  const am=getActiveMetals();
  if(am.length===0) return true;
  return d.metalli.some(m=>am.includes(m));
}

function nodePos(d){
  return {x: Math.round(d.x*W), y: Math.round(d.y*H)};
}

// Gruppi per le etichette a sfondo
const GROUPS = [
  {t:'mag', label:'MAGMATICI', x:.15, col:'rgba(240,160,48,.06)'},
  {t:'hyd', label:'IDROTERMALI', x:.38, col:'rgba(0,184,224,.06)'},
  {t:'sed', label:'SEDIMENTARI', x:.72, col:'rgba(64,184,112,.06)'},
  {t:'met', label:'METAMORFICI', x:.88, col:'rgba(192,96,240,.06)'},
  {t:'sup', label:'SUPERGENE', x:.55, col:'rgba(224,80,80,.06)'},
];

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#07090e'; ctx.fillRect(0,0,W,H);

  // Connessioni tra tipi collegati
  const links=[
    ['por','epi_hs'],['por','skarn'],['por','sup_cu'],
    ['epi_hs','epi_ls'],
    ['vms','mob_met'],['bif','lat_ni'],
    ['peg','grafite'],['nicu','lat_ni'],
    ['oro_oro','oro_met'],
  ];
  ctx.lineWidth=1; ctx.setLineDash([3,4]);
  links.forEach(([a,b])=>{
    const da=DEPOSITS.find(d=>d.id===a);
    const db=DEPOSITS.find(d=>d.id===b);
    if(!da||!db||!isVisible(da)||!isVisible(db)) return;
    const pa=nodePos(da), pb=nodePos(db);
    ctx.strokeStyle='rgba(100,110,150,0.25)';
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Sfondo gruppi
  const groupW=W*0.14;
  GROUPS.forEach(g=>{
    if(!activeTypes.has(g.t)) return;
    ctx.fillStyle=g.col;
    ctx.fillRect(Math.round(g.x*W-groupW/2),0,groupW,H);
    ctx.font=`700 ${Math.max(9,Math.min(11,W*0.008))}px Space Mono`;
    ctx.fillStyle='rgba(180,185,210,0.2)';
    ctx.textAlign='center';
    ctx.fillText(g.label, Math.round(g.x*W), 20);
  });

  // Nodi
  DEPOSITS.forEach(d=>{
    const vis=isVisible(d);
    const p=nodePos(d);
    const col=COLS[d.t];
    const r=sel===d.id?10:(d.t==='hyd'?5:7);
    const alpha=vis?1:0.15;

    ctx.globalAlpha=alpha;
    // Alone selezione
    if(sel===d.id && vis){
      ctx.beginPath(); ctx.arc(p.x,p.y,r+5,0,Math.PI*2);
      ctx.fillStyle=col+'33'; ctx.fill();
    }
    // Cerchio
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=col+'cc'; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();

    // Label
    ctx.font=`${Math.max(8,Math.min(10,W*0.007))}px Crimson Pro`;
    ctx.fillStyle=vis?'#c8ccdc':'#404458';
    ctx.textAlign='center';
    const lx=p.x, ly=p.y+r+12;
    ctx.fillText(d.n, lx, ly);
    ctx.globalAlpha=1;
  });
}

// ─── INTERAZIONE ──────────────────────────────────────────────────
const tip=document.getElementById('tip');
const infoBox=document.getElementById('infoBox');

function hitTest(mx,my){
  let best=null, bestD=999;
  DEPOSITS.forEach(d=>{
    if(!isVisible(d)) return;
    const p=nodePos(d);
    const dist=Math.hypot(mx-p.x,my-p.y);
    if(dist<16 && dist<bestD){bestD=dist;best=d;}
  });
  return best;
}

C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const d=hitTest(mx,my);
  if(d){
    tip.style.display='block';
    tip.style.left=(mx+14)+'px'; tip.style.top=(my-10)+'px';
    tip.textContent=d.n+' · '+d.metalli.join(', ');
    C.style.cursor='pointer';
  } else {
    tip.style.display='none';
    C.style.cursor='default';
  }
});

C.addEventListener('click',e=>{
  const r=C.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const d=hitTest(mx,my);
  if(d){
    sel=d.id;
    draw();
    showInfo(d);
  }
});

function showInfo(d){
  const col=COLS[d.t];
  infoBox.innerHTML=`
    <div style="margin-bottom:.5rem">
      <span class="tag ${d.t}">${TYPES[d.t].toUpperCase()}</span>
      ${d.metalli.map(m=>`<span class="tag ${d.t}">${m}</span>`).join('')}
    </div>
    <b style="color:${col};font-size:.8rem">${d.n}</b>
    <div style="color:var(--muted);font-size:.7rem;margin:.2rem 0 .5rem;font-style:italic">${d.sub}</div>
    <div class="row"><span class="lbl">Tenore</span><span class="val">${d.tenore}</span></div>
    <div class="row"><span class="lbl">Dimensioni</span><span class="val">${d.dim}</span></div>
    <div class="row"><span class="lbl">Ambiente</span><span class="val">${d.amb}</span></div>
    <div class="row"><span class="lbl">Geodinamica</span><span class="val">${d.geodin}</span></div>
    <div class="row"><span class="lbl">Minerali</span><span class="val">${d.min}</span></div>
    <div class="row"><span class="lbl">Esplorazione</span><span class="val">${d.expl}</span></div>
    <div class="esempi"><b>Esempi:</b> ${d.esempi}</div>
  `;
}

resize();
</script>
</body>
</html>
